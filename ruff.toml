line-length = 120

[format]
quote-style = "single"

[lint.isort]
lines-after-imports = 2

[lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"

[lint.pep8-naming]
ignore-names = ["*Exception"]  # Allow non-error exceptions

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Disable unused-import when bulk exporting
"test_*.py" = ["S101"]    # Allow assertions in test files

[lint]
select = [
  "A",     # flake8-builtins
  "ANN",   # flake8-annotations
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comrehensions
  "C90",   # mccabe
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "E",     # pycodestyle error
  "F",     # pyflakes
  "FIX",   # flake8-fixme
  "FURB",  # refurb
  "I",     # isort
  "INP",   # flake8-no-pep420
  "N",     # pep8-naming
  "PERF",  # perflint
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "Q",     # flake8-quotes
  "RUF",   # ruff
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "TC",    # flake8-type-checking
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warning
]
ignore = [
  "D203",    # choice between D203 (incorrect-blank-line-before-class) and D211 (no-blank-line-before-class)
  "D213",    # choice between D212 (multi-line-summary-first-line) and D213 (multi-line-summary-second-line)
  "PLC1901", # compare-to-empty-string (we prefer explicit comparisons)
  "PLR091",  # too-many-* (we find cyclomatic complexity neater)
  "PTH123",  # builtin-open (the builtin open is perfectly fine)
]
