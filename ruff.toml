line-length = 120

[format]
quote-style = "single"

[lint.isort]
lines-after-imports = 2

[lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[lint.flake8-quotes]
inline-quotes = "single"

[lint.pydocstyle]
convention = "google"

[lint.pep8-naming]
ignore-names = ["*Exception"]  # Allow non-error exceptions

[lint.per-file-ignores]
"__init__.py" = [
  "F401" # Disable unused-import when bulk exporting
]
"conftest.py" = [
  "D",   # Disable pydocstyle for fixtures
]
"test_*.py" = [
  "D",   # Disable pydocstyle for tests
]

[lint]
select = [
  "A",     # flake8-builtins
  "ANN",   # flake8-annotations
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comrehensions
  "C90",   # mccabe
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "E",     # pycodestyle error
  "F",     # pyflakes
  "FIX",   # flake8-fixme
  "FURB",  # refurb
  "I",     # isort
  "INP",   # flake8-no-pep420
  "N",     # pep8-naming
  "PERF",  # perflint
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "RUF",   # ruff
  "SIM",   # flake8-simplify
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warning
]
ignore = [
  "D107",    # undocumented-public-init (we add documentation in the class itself)
  "E501",    # line-too-long (long lines are long for a reason)
  "E74",     # ambiguous-{variable,class,function}-name (I have trouble believing that these are real rules)
  "PLC1901", # compare-to-empty-string (we prefer explicit comparisons)
  "PLR091",  # too-many-* (we find cyclomatic complexity neater)
  "PLR1714", # repeated-equality-comparison (does it really matter if we write `a == 1 or a == 2` or `a in {1, 2}`?)
  "PLR2004", # magic-value-comparison (magic values sometimes express the intent more clearly than an awkwardly named constant)
  "RUF001", "RUF002", "RUF003", # ambiguous-unicode-character-{string,docstring,comment} (why do such rules even exist?)
  "TRY003",  # raise-vanilla-args (forbidding errors with messages is a bit too much)
]
