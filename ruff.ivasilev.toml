line-length = 120

[format]
quote-style = "single"

[lint.isort]
lines-after-imports = 2

[lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[lint.flake8-quotes]
inline-quotes = "single"

[lint.pydocstyle]
convention = "google"

[lint.pep8-naming]
ignore-names = ["*Exception"]  # Allow non-error exceptions

[lint.per-file-ignores]
"__init__.py" = [
  # Do not report unused imports when bulk exporting
  "unused-import"
]
"conftest.py" = [
  # Disable pydocstyle undocumented-* rules for fixtures
  "D1",
]
"test_*.py" = [
  # Disable pydocstyle undocumented-* rules for tests
  "D1",

  # Allow test_* methods that do not use self
  "no-self-use"
]

[lint]
select = [
  "A",     # flake8-builtins
  "ANN",   # flake8-annotations
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comrehensions
  "C90",   # mccabe
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "E",     # pycodestyle error
  "F",     # pyflakes
  "FIX",   # flake8-fixme
  "FURB",  # refurb
  "I",     # isort
  "INP",   # flake8-no-pep420
  "N",     # pep8-naming
  "PERF",  # perflint
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "RUF",   # ruff
  "SIM",   # flake8-simplify
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warning
]
ignore = [
  # too-many-* (we find cyclomatic complexity neater)
  "PLR091",

  # We add documentation in the class itself
  "undocumented-public-init",

  # Long lines are long for a reason
  "line-too-long",

  # I have trouble believing that these are real rules
  "ambiguous-variable-name",
  "ambiguous-class-name",
  "ambiguous-function-name",

  # We prefer explicit comparisons
  "compare-to-empty-string",

  # Does it really matter if we write `a == 1 or a == 2` or `a in {1, 2}`?
  "repeated-equality-comparison",

  # Magic values sometimes express the intent more clearly than an awkwardly named constant
  "magic-value-comparison",

  # Why do such rules even exist?
  "ambiguous-unicode-character-string",
  "ambiguous-unicode-character-docstring",
  "ambiguous-unicode-character-comment",

  # Forbidding errors with messages is a bit too much
  "raise-vanilla-args",
]
