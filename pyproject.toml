[project]
name = "ruff-config-ivasilev"
version = "0.15.post9"
description = "Shared ruff configuration."
readme = "README.md"
requires-python = ">=3.10"
license = "CC0-1.0"
license-files = ["LICENSES/CC0-1.0.txt"]
dependencies = []

authors = [
  { name = "Ianis Vasilev", email = "ianis@ivasilev.net" }
]

classifiers = [
  "Private :: Do Not Upload",
]

[project.urls]
Repository = "https://github.com/v--/ruff-config-ivasilev.git"

[build-system]
# uv build complains if no upper bound is set, but it updates its minor versions often, so we put a major version just to shut it up
requires = ["uv_build (>=0.10, <1)"]
build-backend = "uv_build"

[tool.uv.build-backend]
data = { "data" = "data" }
